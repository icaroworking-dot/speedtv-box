name: Validate SpeedTV agent

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  python-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile agent
        run: python -m py_compile public/speedtvbox.py
      - name: Run built-in tests
        run: python public/speedtvbox.py selftest
